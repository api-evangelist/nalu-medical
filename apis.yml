aid: nalu-medical
name: Nalu Medical
description: >-
  Nalu Medical, Inc. is a privately held, commercial-stage medical device company headquartered in
  Carlsbad, California, that develops the Nalu Neurostimulation System for the management of chronic
  pain. The system pairs a battery-free micro implantable pulse generator (mIPG) with an externally
  worn Therapy Disc that powers it wirelessly, and is controlled by the patient through a
  smartphone-based remote-control application; it is FDA-cleared for both spinal cord stimulation
  (SCS) and peripheral nerve stimulation (PNS). Nalu publishes patient and provider resources,
  instructions for use, clinical evidence and peer-reviewed publications on nalumed.com. It operates
  no public developer program - as of the 2026-08-26 enrichment pass there is no API reference, no
  OpenAPI/AsyncAPI/GraphQL contract, no SDK, no MCP server and no developer portal on any host the
  company controls.
